# ============================================================
# 把这个文件复制成 config.local.yaml 再填真实凭据。
# config.local.yaml 已在 .gitignore 里,不会进仓库。
#
#     copy config.example.yaml config.local.yaml
#
# 每一项也都可以改用环境变量,环境变量优先级更高(见括号内名字)。
# ============================================================

# ---------- Google Ads API(关键词规划师拓词/补搜索量)----------
# 怎么申请见 docs/google-ads-setup.md
google_ads:
  developer_token: ""      # (GKP_DEVELOPER_TOKEN) MCC -> API 中心 -> 查看令牌
  client_id: ""            # (GKP_CLIENT_ID)     OAuth 桌面应用客户端
  client_secret: ""        # (GKP_CLIENT_SECRET)
  refresh_token: ""        # (GKP_REFRESH_TOKEN) 跑一次 python -m app.auth 生成
  login_customer_id: ""    # (GKP_LOGIN_CUSTOMER_ID) MCC 账号 ID,纯数字不带横杠

# ---------- Claude API(执行 SEO skill)----------
anthropic:
  api_key: ""              # (ANTHROPIC_API_KEY) console.anthropic.com 自取
  model: "claude-opus-5"
  effort: "high"           # low / medium / high / xhigh / max

# ---------- 排名监控(第 2 期启用)----------
dataforseo:
  login: ""                # (DATAFORSEO_LOGIN)
  password: ""             # (DATAFORSEO_PASSWORD)

# ---------- 飞书推送(第 2 期启用)----------
feishu:
  app_id: ""               # (FEISHU_APP_ID)
  app_secret: ""           # (FEISHU_APP_SECRET)
  receive_id: ""           # 接收消息的 open_id
  tenant_url: ""           # 你们飞书租户的地址，如 https://your-company.feishu.cn
                           # 只用来拼生成文档的链接；留空会退回通用域名

# ---------- 社媒周报(第 5 期启用)----------
# 周报生成后可以直接建成飞书云文档。留空则只在本地导出 markdown。
social:
  # 建好的周报放进哪个云盘文件夹(文件夹链接末段的 token)。留空则放个人空间根目录。
  folder_token: ""
  # 建好后给谁加编辑权(open_id)。注意 open_id 按应用隔离,要用上面这个 app 下的 id。
  owner_open_id: ""
  # 文档标题模板。可用 {client} {label} {start} {end}
  # 日期已格式化成 2026.09.13 / 09.20，直接拼即可
  title: "{client} {label}运营周报 {start}-{end}"

# ---------- 本地路径 ----------
paths:
  # skill 内容包目录。留空则依次尝试:
  #   ./skills  ->  ~/.claude/skills
  skills_dir: ""
  # 导出文件落在哪
  out_dir: "out"

# ---------- 取数默认值(可在界面上临时覆盖)----------
defaults:
  geo: "US"                # 地区,两位国家代码
  lang: "en"               # 语言
  min_volume: 10           # 拓词时过滤掉月均搜索量低于此值的词
  usd_rate: 6.9            # 出价换算成 USD 时用的汇率。账号币种不是 USD 时,出价列按此折算

# ---------- LLM(skill 引擎用)----------
# 刻意不绑死一家:模型名变动很快(DeepSeek 半年改了三次),
# 不同 skill 也该配不同模型。价格表也放这里,涨价降价不用改代码。
llm:
  provider: "deepseek"       # deepseek | anthropic | openai_compatible
  model: "deepseek-flash"    # deepseek-flash(便宜快) / deepseek-v4-pro(更强)
                             # ⚠ deepseek-chat、deepseek-reasoner、deepseek-v4-flash 均已退役
  api_key: ""                # (LLM_API_KEY) platform.deepseek.com 自取
  base_url: ""               # 留空用 provider 默认;自建/中转端点填这里
  effort: ""                 # 留空即默认;deepseek 支持 low/high/max
  max_tokens: 16000
  timeout: 600

  # 按 skill 覆盖(可选):审计类规则性强、便宜模型够用;写稿可以上更强的
  per_skill: {}
  #  seo-content-writer:
  #    model: "deepseek-v4-pro"

  # 价格($/1M token),只用于估算花费
  pricing: {}
  #  deepseek-flash: {in: 0.30, out: 1.20, cache_in: 0.007}

# ---------- 排名监控项目 ----------
# 客户项目写在这里(config.local.yaml),**公开仓库不带任何客户信息**。
# domain 务必写裸域名:写成 example.com/ 或 https://example.com/ 会让名次
# 永远匹配不上,表现是「这个站一个词都没排名」,而且不报错。
rank_projects:
  - name: "示例项目"
    domain: "example.com"      # 裸域名,别带 http:// 和尾斜杠
    gl: "US"                   # 搜索所在地区
    hl: "en"                   # 界面语言
    device: "desktop"          # desktop / mobile
    depth: 3                   # 查前几页,3 = 前 30 名
    keywords:
      - "example keyword one"
      - "example keyword two"
    # 飞书词库(可选):配了就能一键同步词库、把排名写回表里
    feishu_url: ""             # 多维表格分享链接,形如 https://xxx.feishu.cn/base/<token>?table=<id>
    feishu_rank_field: ""      # 排名列名;留空取「当月N月排名」,各家表列名不一致时在这里指定

# ---------- 排名监控参数 ----------
ranks:
  batch_size: 100            # standard 模式每次下单词数(上限 100)
  poll_sec: 15               # 轮询间隔
  timeout_sec: 1800          # 整轮取结果上限;超时未回的词记 error,下轮取回不重复扣费

# ---------- 服务 ----------
server:
  host: "127.0.0.1"        # 只给自己用就保持这个
                           # 内网共享给全组用:改成 "0.0.0.0",并且**必须**填下面的口令
  port: 8790
  # 非本机访问时要求的口令。host 不是 127.0.0.1 而这里为空,程序会拒绝启动 ——
  # 因为本程序持有 Google Ads / DataForSEO / DeepSeek / 飞书 凭据,
  # 其中排名查询和 AI 调用是花钱的,裸奔等于把账单交给整个内网。
  # 随便生成一串:python -c "import secrets;print(secrets.token_urlsafe(24))"
  access_token: ""
  open_browser: true
